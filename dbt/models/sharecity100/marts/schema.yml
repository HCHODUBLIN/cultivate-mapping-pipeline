version: 2

models:
  - name: fsi_2016
    description: 2016 SHARECITY 100 FSIs — public schema (production export format).
    columns:
      - name: city
        tests:
          - not_null
      - name: name
        tests:
          - not_null
      - name: url
        tests:
          - not_null

  - name: fsi_2024
    description: 2024 LLM-validated FSIs — public schema (production export format).
    columns:
      - name: city
        tests:
          - not_null
      - name: name
        tests:
          - not_null
      - name: url
        tests:
          - not_null

  - name: fsi_sharecity100
    description: Unified 2016 + 2024 SHARECITY 100 dataset (2016 priority).
    columns:
      - name: datasetYear
        quote: true
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [sc2016, sc2024]
      - name: city
        tests:
          - not_null
      - name: name
        tests:
          - not_null
      - name: url
        tests:
          - not_null
